name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes a release commit + tag
      issues: write # @semantic-release/github comments on referenced issues
      pull-requests: write # @semantic-release/github comments on referenced PRs
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history to read commits since the last release

      - uses: pnpm/action-setup@v4 # version comes from package.json's "packageManager" field

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm CLI >=11.5.1; don't rely on
      # whatever ships bundled with the Node version above.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # see ci.yml -- @oauth-spa-kit/nuxt's tsconfig.json references the
      # playground's generated .nuxt/tsconfig.*.json for #imports to resolve.
      - run: pnpm --filter=@oauth-spa-kit/nuxt run dev:prepare

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # master's ruleset rejects any direct push (see release.config.js's own comment on why
      # @semantic-release/git was dropped) -- the version-bump/changelog files the "release"
      # step above already wrote to disk (but never committed) get their own PR here instead,
      # merged immediately via the API rather than a raw push, satisfying both the
      # "must go through a pull request" and "must merge via API or UI" rules.
      - name: Open and merge a PR for the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit -- no release ran (no releasable commits since the last tag)."
            exit 0
          fi

          version="$(node -p "require('./packages/core/package.json').version")"
          branch="chore/release-${version}"
          message="chore(release): ${version} [skip ci]"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md packages/*/package.json
          git commit -m "$message"
          git push origin "$branch"

          gh pr create --base master --head "$branch" --title "$message" \
            --body "Automated version bump + changelog for \`${version}\` -- see \`CHANGELOG.md\` for what's included. This repo's own tag/npm publish/GitHub Release already happened in the previous step; this PR only syncs the version-bump commit back into \`master\`, since a direct push is rejected."

          # The PR's own required checks (this exact commit, on its own branch) have to report
          # before the merge attempt below is even allowed -- poll rather than assume they're
          # already done by the time this step reaches here.
          for _ in $(seq 1 30); do
            check_state="$(gh pr checks "$branch" --json state --jq '[.[].state] | unique | join(",")' 2>/dev/null || echo PENDING)"
            case "$check_state" in
              SUCCESS) break ;;
              *FAILURE*|*ERROR*|*CANCELLED*) echo "Release PR checks failed: $check_state"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done

          gh pr merge "$branch" --squash --subject "$message" --delete-branch
